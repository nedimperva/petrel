[package]
name = "petrel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Petrel engine: drafts, versions, search, templates, actions"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "array"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
uuid = { version = "1.28.0", features = ["v4"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
