[workspace]
resolver = "2"
members = ["crates/petrel-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nedimperva/petrel"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Debug builds: line numbers for Petrel's own code, no debug info for dependencies (Tern's Windows target/ had
# grown past 11 GB with .pdb files; this keeps builds fast and small).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
