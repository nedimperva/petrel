[package]
name = "petrel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Petrel: quick capture and notes, as Markdown files in one folder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
petrel-core = { path = "../crates/petrel-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
tauri-plugin-dialog = "2"
dirs = "7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# AI on request: the Claude API over HTTPS from Rust, the key in the OS keyring.
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# "Copy formatted": Markdown to HTML for the clipboard.
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }

# The capture's quote: the selected text and the window it was in, read through UI Automation.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
