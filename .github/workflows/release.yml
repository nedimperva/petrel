name: release

# A tag like v0.2.0 builds Petrel for Windows and Linux and publishes a GitHub release with the installers and
# latest.json, which the app reads to update itself (tauri.conf.json, plugins.updater). The builds are signed with
# the updater key in the repo secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the
# version in the tag must match tauri.conf.json, package.json and Cargo.toml (scripts/version.mjs sets all three).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One draft release first, so the two builds upload into it instead of racing to create it.
  draft:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the app's version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; fi
      - id: make
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Petrel ${context.ref.replace('refs/tags/', '')}`,
              body: [
                'Windows: the `-setup.exe`. Linux: the `.AppImage` (updates itself) or the `.deb`.',
                '',
                'Petrel looks for a new version at start and every six hours and asks before it installs one.',
              ].join('\n'),
              draft: true,
              generate_release_notes: true,
            });
            core.setOutput('id', data.id);

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for the AppImage: built against an older glibc, it runs on newer systems too.
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libdbus-1-dev libssl-dev pkg-config patchelf

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true

  # Published only when both builds are in, so latest.json never points at a missing installer.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ needs.draft.outputs.id }}'),
              draft: false,
              make_latest: 'true',
            });
